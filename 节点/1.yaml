#---------------------------------------------------#
#  Clash-Meta / Clash-Meta-Alpha 单节点配置
#  节点名：新加坡-001🐮🐮🐮
#  协议：vless + xtls-rprx-vision
#---------------------------------------------------#
port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

proxies:
  - name: "新加坡-001🐮🐮🐮"
    type: vless
    server: 172.236.130.46
    port: 20272
    uuid: D45FF326-2FC1-43EF-9C13-18BDFD4D2A7B
    # vless 不需要 alterId
    # vless 不需要 encryption 字段（Clash-Meta 会自动处理）
    tls: true
    servername: www.cloudflare.com   # SNI
    # xtls-rprx-vision
    flow: xtls-rprx-vision
    # 允许不安全证书（节点自带 allowInsecure=1）
    skip-cert-verify: true
    udp: true

proxy-groups:
  - name: 🚀 Proxy
    type: select
    proxies:
      - 新加坡-001🐮🐮🐮

rules:
  - MATCH,🚀 Proxy
